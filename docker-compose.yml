# Docker Compose stack for AI RCA Agent platform.
#
# Includes:
# - AI RCA Agent (with Docker socket mount)
# - PostgreSQL (database, internal only)
#
# API is exposed directly on port 8000.

services:
  # ============================================
  # AI RCA Agent - Core Service
  # ============================================
  rcagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-rcagent:latest
    container_name: ai-rcagent
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Docker socket for container monitoring (READ-ONLY for security)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Configuration
      - ./config:/app/config:ro
      # Data persistence
      - rcagent_data:/app/data
      # Custom log files for non-Docker app monitoring (host dir → /host-logs)
      - ${CUSTOM_LOG_DIR:-./logs}:/host-logs:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma:2b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-pro}
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-rcagent@example.com}
      - EMAIL_TO=${EMAIL_TO:-devops@example.com}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=rcagent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rcagent_secret}
      - POSTGRES_DB=rcagent
      - ENVIRONMENT_TYPE=${ENVIRONMENT_TYPE:-docker-compose}
      - AI_ANALYSIS_INTERVAL=${AI_ANALYSIS_INTERVAL:-5}
      - AI_ANALYSIS_TIMEOUT=${AI_ANALYSIS_TIMEOUT:-150}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      # Custom log file monitoring (non-Docker applications)
      # Comma-separated paths (inside the container) to log files to tail.
      # Host log dir is mounted to /host-logs via the volume above; set
      # CUSTOM_LOG_FILES to paths under /host-logs, e.g.:
      #   CUSTOM_LOG_FILES=/host-logs/app.log
      # NOTE: existing lines are seeded into the buffer (no alerts). Only NEW
      # lines appended after startup trigger error detection/notifications.
      - CUSTOM_LOG_FILES=${CUSTOM_LOG_FILES:-}
      - CUSTOM_LOG_NAMES=${CUSTOM_LOG_NAMES:-}
      - LOG_FILE_POLL_INTERVAL=${LOG_FILE_POLL_INTERVAL:-0.5}
      - LOG_FILE_TAIL_LINES=${LOG_FILE_TAIL_LINES:-100}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rcagent_network
    # Resolve host.docker.internal to host gateway for Ollama connectivity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Add rcagent user to docker group (GID 998) for Docker socket access
    group_add:
      - "998"
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Error Generator - Test Container (profile: test)
  # ============================================
  # Generates realistic CRITICAL/HIGH error logs so the RCA pipeline
  # (DockerMonitor -> ErrorDetector -> RCA via OpenRouter -> Google Chat)
  # can be exercised end-to-end. Not started by default; run with:
  #   docker compose --profile test run --rm error-generator
  # or use scripts/test_container_error_pipeline.sh
  error-generator:
    build:
      context: ./tests/error_generator
      dockerfile: Dockerfile
    image: rca-error-generator:latest
    container_name: rca-error-generator
    profiles:
      - test
    # Unique name per run so the agent treats each run as a new container
    # and dedup windows never suppress a fresh test.
    environment:
      - ERROR_MODE=${ERROR_MODE:-burst}
      - ERROR_INTERVAL_SECONDS=${ERROR_INTERVAL_SECONDS:-1.5}
      - ERROR_BURSTS=${ERROR_BURSTS:-1}
    depends_on:
      - rcagent
    networks:
      - rcagent_network
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ============================================
  # PostgreSQL - Database (internal only)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: rcagent-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=rcagent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rcagent_secret}
      - POSTGRES_DB=rcagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcagent -d rcagent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rcagent_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  rcagent_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  rcagent_network:
    driver: bridge
    name: rcagent_network
